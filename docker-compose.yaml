services:
  app:
    build:
      dockerfile: ./Dockerfile
      context: ./
    environment:
      - DATABASE_URL_asyncpg=postgresql+asyncpg://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      pg:
        condition: service_healthy



  pg:
    image: postgres:16.4
    environment: # При старте compose значения DB_... будут автоматически похватиываться из .env-файла
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes: #Тома данных для БД
      - pg-data:/var/lib/postgresql/data


volumes:
  pg-data: